name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-verification:
    runs-on: ubuntu-24.04
    env:
      GLX_POSTGRES_SUPERUSER_PASSWORD: glx-local-postgres
      REGISTRY_DB_PASSWORD: glx-local-registry-runtime
      EXCHANGE_DB_PASSWORD: glx-local-exchange-runtime
      REGISTRY_MIGRATOR_PASSWORD: glx-local-registry-migrator
      EXCHANGE_MIGRATOR_PASSWORD: glx-local-exchange-migrator
      GATEWAY_SESSION_REDIS_PASSWORD: glx-local-redis
      KEYCLOAK_ADMIN_PASSWORD: glx-local-keycloak
      MINIO_ROOT_USER: glx-local-minio
      MINIO_ROOT_PASSWORD: glx-local-minio-password
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.12.0
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: curl -LsSf https://astral.sh/uv/install.sh | env UV_UNMANAGED_INSTALL="$PWD/.tools/uv" sh
      - run: cp .env.example .env && env | grep -E '^(GLX_POSTGRES|REGISTRY_DB|EXCHANGE_DB|REGISTRY_MIGRATOR|EXCHANGE_MIGRATOR|GATEWAY_SESSION|KEYCLOAK_ADMIN|MINIO_ROOT)' >> .env
      - run: NPM_CONFIG_CACHE="$PWD/.tools/npm-cache" npx --yes --package=pnpm@10.28.2 pnpm install --frozen-lockfile
      - run: ./scripts/verify.sh --full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-artifacts
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/bom.*
            playwright-report/**
          if-no-files-found: warn
