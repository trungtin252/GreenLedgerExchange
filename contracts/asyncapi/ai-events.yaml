asyncapi: 3.0.0
info:
  title: GLX AI Verification Events
  version: 0.1.0
  description: Envelope foundation for future AI verification events.
channels:
  glx.ai.events:
    address: glx.ai.events
    messages:
      cloudEvent:
        $ref: '#/components/messages/CloudEvent'
operations:
  publishAiEvent:
    action: send
    channel:
      $ref: '#/channels/glx.ai.events'
    messages:
      - $ref: '#/channels/glx.ai.events/messages/cloudEvent'
components:
  messages:
    CloudEvent:
      name: cloudEvent
      payload:
        $ref: '#/components/schemas/CloudEventEnvelope'
  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, time, datacontenttype, correlationid, data]
      properties:
        specversion:
          const: '1.0'
        id:
          type: string
          format: uuid
        source:
          type: string
          format: uri-reference
        type:
          type: string
        time:
          type: string
          format: date-time
        datacontenttype:
          const: application/json
        correlationid:
          type: string
          format: uuid
        data:
          type: object
          additionalProperties: true
