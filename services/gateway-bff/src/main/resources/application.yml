spring:
  application:
    name: gateway-bff
  lifecycle:
    timeout-per-shutdown-phase: 20s
  session:
    redis:
      namespace: glx:gateway:session
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${GATEWAY_SESSION_REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:glx-bff}
            client-secret: ${OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            client-authentication-method: none
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/glx-local}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: registry-service
              uri: ${REGISTRY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/registry/**
              filters:
                - TokenRelay=
            - id: exchange-service
              uri: ${EXCHANGE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/exchange/**
              filters:
                - TokenRelay=
server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${GLX_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash
glx:
  runtime:
    environment: ${GLX_ENVIRONMENT:local}
    sandbox: true
